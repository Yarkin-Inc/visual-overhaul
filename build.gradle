plugins {
    id "net.fabricmc.fabric-loom" version "1.17.21"
}

version = "${mod_version}+mc${minecraft_version}-dev"
group = "eu.midnightdust"
base { archivesName = "visualoverhaul-fabric" }
repositories { maven { url = "https://api.modrinth.com/maven" } }

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation "maven.modrinth:midnightlib:${midnightlib_version}"
    include "maven.modrinth:midnightlib:${midnightlib_version}"
}

sourceSets.main {
    java.srcDirs = ["common/src/main/java", "fabric/src/main/java"]
    resources.srcDirs = ["common/src/main/resources", "fabric/src/main/resources"]
}
processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", minecraft_version
    filesMatching("fabric.mod.json") {
        expand version: project.version, minecraft_version: minecraft_version
    }
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
    options.compilerArgs += ["-Xmaxerrs", "1000"]
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
jar { from("LICENSE") }

fabricApi.configureTests {
    createSourceSet = true
    modId = 'visualoverhaul_test'
    enableGameTests = false
    enableClientGameTests = true
}
